<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a Slot — Karma Car Detailing, Surat</title>
<link rel="stylesheet" href="css/style.css"></head>
<body><main>
<section class="phero" style="padding-bottom:30px"><p class="eyebrow">3 steps · confirmed on WhatsApp</p><h1 class="display split">Book a slot</h1></section>
<section class="wrap" style="padding-bottom:120px"><div class="book">
  <form class="panel" id="bk" novalidate>
    <div class="prog"><i class="on"></i><i></i><i></i></div>
    <div class="stepx on"><h3 class="display" style="font-size:36px">1 · Your car</h3><div class="opts" id="sz"></div></div>
    <div class="stepx"><h3 class="display" style="font-size:36px">2 · Services</h3><p style="color:var(--mute)">Pick one or more.</p><div class="opts" id="sv"></div></div>
    <div class="stepx"><h3 class="display" style="font-size:36px">3 · When & who</h3>
      <div class="grid2">
        <label>Name<input class="field" name="name" required autocomplete="name"></label>
        <label>Phone<input class="field" name="phone" required inputmode="tel" pattern="[6-9][0-9]{9}" placeholder="10-digit mobile" autocomplete="tel"></label>
        <label>Car model<input class="field" name="model" required placeholder="e.g. Hyundai Creta"></label>
        <label>Preferred date<input class="field" name="date" type="date" required></label>
        <label>Time<select class="field" name="time"><option>9–11 am</option><option>11–1 pm</option><option>2–4 pm</option><option>4–6 pm</option></select></label>
        <label>Pick-up & drop?<select class="field" name="pick"><option>No, I'll drive in</option><option>Yes, pick up my car</option></select></label>
        <label class="full">Notes<textarea class="field" name="notes" rows="3" placeholder="Scratches, area for pick-up, anything we should know"></textarea></label>
      </div></div>
    <p class="err" id="err" role="alert"></p>
    <div class="nav-b"><button type="button" class="btn ghost" id="back"><span>Back</span></button><button type="button" class="btn" id="next"><span>Next</span></button></div>
  </form>
  <aside class="panel sum"><p class="eyebrow">Your estimate</p><div id="rows" style="margin-top:14px"></div><div class="tot" id="tot">₹0</div><small style="color:var(--mute)">Final price confirmed after a free paint inspection.</small></aside>
</div></section>
</main>
<script src="js/gsap.min.js"></script><script src="js/ScrollTrigger.min.js"></script><script src="js/lenis.min.js"></script><script src="js/app.js"></script>
<script>
const qs = new URLSearchParams(location.search), PKG = { Refresh: ["foam", "interior", "headlight"], Showroom: ["polish", "ceramic", "interior"], Armour: ["correct", "ppf", "rust"] };
let step = 0, size = qs.has("z") ? +qs.get("z") : null;
const picked = new Set(qs.get("s") ? [qs.get("s")] : PKG[qs.get("p")] || []);
const f = $("#bk"), d = f.date;
d.min = new Date(Date.now() + 864e5).toISOString().slice(0, 10); // booking page, not composition: real dates are fine here
$("#sz").innerHTML = SIZES.map((s, i) => `<button type="button" class="opt" data-i="${i}"><b>${s}</b><small>${["i20, Swift, Polo", "City, Verna, Ciaz", "Creta, XUV700, Fortuner", "BMW, Merc, Audi"][i]}</small></button>`).join("");
const drawSv = () => $("#sv").innerHTML = SVC.map(s => `<button type="button" class="opt ${picked.has(s.id) ? "on" : ""}" data-id="${s.id}"><b>${s.name}</b><small>${size == null ? "" : inr(s.p[size]) + " · "}${s.time}</small></button>`).join("");
function sum() {
  $$("#sz .opt").forEach(b => b.classList.toggle("on", +b.dataset.i === size));
  const L = SVC.filter(s => picked.has(s.id)), disc = L.length >= 3 ? .15 : 0;
  let t = size == null ? 0 : L.reduce((a, s) => a + s.p[size], 0);
  $("#rows").innerHTML = `<div class="row"><span>Car</span><b>${size == null ? "—" : SIZES[size]}</b></div>` + L.map(s => `<div class="row"><span>${s.name}</span><span>${size == null ? "—" : inr(s.p[size])}</span></div>`).join("") + (disc && size != null ? `<div class="row gold"><span>Bundle saving 15%</span><span>−${inr(Math.round(t * disc))}</span></div>` : "");
  t = Math.round(t * (1 - disc)); const o = { v: +($("#tot").dataset.v || 0) }; gsap.to(o, { v: t, duration: .6, onUpdate: () => $("#tot").textContent = inr(Math.round(o.v)) });
  $("#tot").dataset.v = t; return { L, t };
}
$("#sz").onclick = e => { const b = e.target.closest(".opt"); if (b) { size = +b.dataset.i; drawSv(); sum(); } };
$("#sv").onclick = e => { const b = e.target.closest(".opt"); if (!b) return; const id = b.dataset.id; picked.has(id) ? picked.delete(id) : picked.add(id); b.classList.toggle("on"); sum(); };
function go(n) {
  const err = $("#err"); err.textContent = "";
  if (n > step) {
    if (step === 0 && size == null) return err.textContent = "Choose your car size.";
    if (step === 1 && !picked.size) return err.textContent = "Pick at least one service.";
    if (step === 2) {
      const bad = [...f.querySelectorAll("[required]")].find(i => !i.checkValidity());
      if (bad) { bad.focus(); return err.textContent = bad.name === "phone" ? "Enter a valid 10-digit Indian mobile." : "Please fill " + bad.name + "."; }
      const { L, t } = sum(), v = Object.fromEntries(new FormData(f));
      const msg = `Hi Karma! I'd like to book:\n• Car: ${v.model} (${SIZES[size]})\n• Services: ${L.map(s => s.name).join(", ")}\n• Estimate: ${inr(t)}\n• Date: ${v.date}, ${v.time}\n• Pick-up: ${v.pick}\n• Name: ${v.name}, ${v.phone}${v.notes ? "\n• Notes: " + v.notes : ""}`;
      toast("Opening WhatsApp to confirm…");
      return setTimeout(() => location.href = `https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`, 700);
    }
  }
  step = Math.max(0, Math.min(2, n));
  $$(".stepx").forEach((s, i) => s.classList.toggle("on", i === step));
  $$(".prog i").forEach((p, i) => p.classList.toggle("on", i <= step));
  $("#back").style.visibility = step ? "visible" : "hidden";
  $("#next span").textContent = step === 2 ? "Confirm on WhatsApp" : "Next";
}
$("#next").onclick = () => go(step + 1); $("#back").onclick = () => go(step - 1);
drawSv(); sum(); go(size != null ? 1 : 0);
</script>
</body></html>
